spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

spring.application.name=chat-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

spring.sql.init.mode=never

spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

app.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
app.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}

server.port=${SERVER_PORT:8086}
server.shutdown=graceful
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
